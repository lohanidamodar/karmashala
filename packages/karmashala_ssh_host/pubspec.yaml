name: karmashala_ssh_host
description: >-
  Running the Karmashala host on a machine reached over SSH, as the server
  does: which bundle a platform needs, deploying and greeting it, installing
  and removing it, the companion port and relay set up on the box, and
  pairing a phone there. Speaks the host's wire protocol through
  `karmashala_host_protocol`, so the server depends on it (slice 5d) without
  a cycle. Pure Dart.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The connection a deploy runs over, and `SshHost`.
  karmashala_ssh:
    path: ../karmashala_ssh
  # The SSH client's channel types a deploy target writes files through.
  dartssh2: ^4.1.0
  # Logging.
  karmashala_core:
    path: ../karmashala_core
  # The host's wire protocol (so the deployer's greeting and the binary it
  # installs cannot drift from what that binary answers) and the readings this
  # package answers with. Not the server itself: the server depends on this
  # package (slice 5d), so it cannot depend back.
  karmashala_host_protocol:
    path: ../karmashala_host_protocol
  # `kHostCompanionPort`, the port a phone dials a box's host on.
  karmashala_remote:
    path: ../karmashala_remote
  meta: ^1.16.0
  # The relay's contract: its default port, the `/k/<token>` prefix and the
  # health route this package builds its URLs from.
  karmashala_relay_protocol:
    path: ../../relay/protocol

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
