# Dart-only stand-in for flutter_local_notifications_windows 1.0.3, wired via a
# dependency_override. The real package's C++ needs ATL and /await, which the
# VS 2026 toolchain (MSVC 14.51) no longer provides; the desktop app never uses
# this plugin (companion mode is Android, where the real Android plugin loads).
# lib/src is copied verbatim from upstream (BSD-3, see LICENSE) minus the FFI
# halves; the plugin below declares no native code, so nothing compiles.
name: flutter_local_notifications_windows
description: Dart-only local stub of the Windows implementation of flutter_local_notifications.
version: 1.0.3+stub
publish_to: none
homepage: https://github.com/MaikuB/flutter_local_notifications/tree/master/flutter_local_notifications_windows

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^9.0.0
  timezone: ^0.10.0
  xml: ^6.5.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
