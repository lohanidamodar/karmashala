name: karmashala_media
description: >-
  Frame capture and video encoding: the animated GIF/PNG sinks and the Windows
  Media Foundation H.264 writer and remuxer. Pure Dart, so it runs under
  `dart test` without a `flutter_tester`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # Frame encoding (animated GIF/PNG) for the terminal recorder.
  image: ^4.8.0
  # Media Foundation's C ABI, for the Windows H.264 writer.
  ffi: ^2.2.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
