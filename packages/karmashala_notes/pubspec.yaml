name: karmashala_notes
description: >-
  Notes and the todo list: the values and the DAOs over their tables. No
  providers and no UI. Pure Dart, so the session host reads them for a phone
  while the desktop app is closed.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The `notes` and `todos` tables, in the app's one schema.
  karmashala_store:
    path: ../karmashala_store

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
