name: karmashala_host
description: >-
  Karmashala's session host: a standalone binary that owns PTYs on a machine and
  outlives the clients that view them. Deployed to SSH hosts today to replace the
  tmux wrapper, which renders an agent's output instead of relaying it. The same
  binary is meant to run on localhost later, so the desktop becomes a client and
  sessions survive an app crash — see lib/src/transport/transport.dart.
publish_to: none

# The app's pub workspace resolves this member. It is built with `dart build
# cli`, not `dart compile exe`, which cannot reach a target with a build hook —
# and `sqlite3`, under `karmashala_store`, has one. The output is a bundle
# (`bin/karmashala_host` beside `lib/libsqlite3.so`), not a single file.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.1.0
  # The app's schema, unchanged: the host owns sessions on a machine with no
  # GUI, so it carries the same ladder rather than a second one that could
  # drift. SQLite itself is bundled by the build hook, so the machine needs no
  # libsqlite3 of its own.
  karmashala_store:
    path: ../karmashala_store

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
