name: karmashala_automations
description: >-
  Work that starts itself: what an automation is and when it is next due (cron
  and interval), which fires a sleeping machine missed, the gate an unattended
  run has to pass, the resumes armed against a usage window's reset, the
  project checks that judge what a run left behind, the three tables all of it
  is stored in, and the scheduler, runner, settler and check runner that act on
  them behind ports. No providers and no UI. Pure Dart, so the session host
  runs it while the desktop app is closed.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # HMAC-SHA256 and SHA-256 for webhook signatures and body hashes.
  crypto: ^3.0.0
  # The agent an automation launches and the environment it runs in, and the
  # usage windows a scheduled resume waits on.
  agent_cli:
    path: ../agent_cli
  # `VerificationVerdict` — the three answers a project check records.
  karmashala_core:
    path: ../karmashala_core
  # `Repository`, the checkout a run starts in.
  karmashala_git:
    path: ../karmashala_git
  # The session a run started or a resume continues, and how it ended.
  karmashala_session:
    path: ../karmashala_session
  # The automation, project-check and scheduled-resume tables the three DAOs
  # read and write. Each takes an `AppDatabase`; their providers stay in the app.
  karmashala_store:
    path: ../karmashala_store
  # A project check's verdict recorded as Karmashala's own verification run.
  karmashala_verification:
    path: ../karmashala_verification

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
