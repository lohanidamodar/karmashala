name: karmashala_companion
description: >-
  The phone. Karmashala's Android companion as a whole feature — the Riverpod
  bridges over the gateway, pairing by QR or short code, the project and
  session lists, one session's transcript, approvals and composer, the inbox,
  settings, and the local notifications a sealed push renders. The wire itself
  is `karmashala_remote`; this is what stands on it. A Flutter package, so its
  suites run under `flutter test`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The agent a start-session screen offers, and the environment label a row
  # shows beside a project.
  agent_cli:
    path: ../agent_cli
  # Unsealing one push envelope, in the background isolate.
  cryptography: ^2.9.0
  # The attach button's picker. The desktop's `pickOneFile` announces itself to
  # subsystems a phone does not have, so the phone calls `openFile` directly.
  file_selector: ^1.1.0
  # The notification an attention event becomes.
  flutter_local_notifications: ^19.0.0
  flutter_riverpod: ^3.3.2
  # `Clock`, `IdGenerator` and `Diagnostics`, behind this package's own three
  # providers.
  karmashala_core:
    path: ../karmashala_core
  # The gateway, the value types and the protocol this whole app reads.
  karmashala_remote:
    path: ../karmashala_remote
  # What a resume offers, and the delivery a row's stat is projected from.
  karmashala_session:
    path: ../karmashala_session
  # Tokens, glyphs, the shared rows and one transcript message.
  karmashala_ui:
    path: ../karmashala_ui
  logging: ^1.3.0
  # The pairing QR scanner.
  mobile_scanner: ^7.0.0
  riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
