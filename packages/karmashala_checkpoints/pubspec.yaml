name: karmashala_checkpoints
description: >-
  Checkpoints of a working tree: the snapshot, the table that indexes them
  and the service that captures and restores one over a private git index.
  No providers and no UI. Pure Dart, so the session host takes the base of
  an unattended run while the desktop app is closed.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # EnvironmentPath, ExecutionEnvironment and the command runners git runs on.
  agent_cli:
    path: ../agent_cli
  # Clock and the small utilities the service reads.
  karmashala_core:
    path: ../karmashala_core
  # GitService, over which a checkpoint is a private-index write-tree.
  karmashala_git:
    path: ../karmashala_git
  # The checkpoints table.
  karmashala_store:
    path: ../karmashala_store
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
