name: karmashala_data_protocol
description: >-
  The client/server data API: typed requests and their results, the change
  events a server pushes, the refusals it answers with, and the JSON envelope
  they travel in. No transport and no store — the host protocol carries it
  today, and the companion protocol can carry the same envelope to a remote
  server.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # `Note` and `Todo`, the values the notes and todos requests carry.
  karmashala_notes:
    path: ../karmashala_notes
  # The workspace values its requests carry: contexts, projects, checkouts
  # and saved sections.
  agent_cli:
    path: ../agent_cli
  # Environments, SSH hosts, trusted host keys, agent installations, saved
  # accounts and usage samples: the values its requests carry, and which of
  # their fields are credentials.
  karmashala_environments:
    path: ../karmashala_environments
  karmashala_git:
    path: ../karmashala_git
  # A file entry, a stat, a stamp and what a save expects: the values the
  # files requests carry (slice 3c).
  karmashala_files:
    path: ../karmashala_files
  karmashala_projects:
    path: ../karmashala_projects
  # Command snippets and saved terminal presets.
  karmashala_snippets:
    path: ../karmashala_snippets
  # Paired devices, as a client is told them (no key, no push token).
  karmashala_remote:
    path: ../karmashala_remote
  # What the server reads off an SSH box — its host, relay, companion port,
  # pairing window and sessions — as values `ssh.*` answers with (slice 5d).
  karmashala_host_protocol:
    path: ../karmashala_host_protocol
  # A box relay's default port, from the relay's contract.
  karmashala_relay_protocol:
    path: ../../relay/protocol
  # Automations, their runs and checks, scheduled resumes and project checks.
  karmashala_automations:
    path: ../karmashala_automations
  # Checkpoints (metadata only), verification runs and comparisons.
  karmashala_checkpoints:
    path: ../karmashala_checkpoints
  karmashala_comparisons:
    path: ../karmashala_comparisons
  # A conversation search's hits and pages, and the index's status.
  karmashala_conversations:
    path: ../karmashala_conversations
  karmashala_verification:
    path: ../karmashala_verification
  # The sessions domain's values its requests carry: a session and the
  # change a client asks of it, its records, and the imported history.
  karmashala_session:
    path: ../karmashala_session
  # Attached Flutter apps, SDK readings and console lines, and the browser's
  # element captures: what the server's runs and browser tell a client.
  karmashala_flutter_apps:
    path: ../karmashala_flutter_apps
  karmashala_browser:
    path: ../karmashala_browser
  # Terminal profiles and agent launches: what `terminals.*` carries (5a).
  karmashala_launch:
    path: ../karmashala_launch
  # A watched session, the inbox and its items, attention and the news
  # reasons: what `status.*` and `inbox.*` carry (5c); and an agent status
  # report's JSON.
  karmashala_notifications:
    path: ../karmashala_notifications
  karmashala_agent_status:
    path: ../karmashala_agent_status

dev_dependencies:
  # `VerificationVerdict`, in the automations envelope test.
  karmashala_core:
    path: ../karmashala_core
  lints: ^6.1.0
  test: ^1.31.1
