# Dart-only stand-in for flutter_secure_storage_windows 4.x, wired via a
# dependency_override. Every published 4.x still ships a native backward-compat
# plugin that includes <atlstr.h>, and the VS 2026 toolchain has no ATL. The
# desktop app never touches secure storage (SecureCompanionStore is companion/
# Android only), so on Windows this registers an implementation that throws.
name: flutter_secure_storage_windows
description: Dart-only local stub of the Windows implementation of flutter_secure_storage.
version: 4.2.2+stub
publish_to: none
homepage: https://github.com/mogol/flutter_secure_storage

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
