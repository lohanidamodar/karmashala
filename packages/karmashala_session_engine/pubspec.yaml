name: karmashala_session_engine
description: >-
  Session lifecycle recorded from what a host observed, not inferred: the
  facts, the status derived from them, the reads and edits every copy of a row
  follows, and — in `store.dart`, the server's — the DAOs and the recorder that
  applies facts to rows. No providers and no UI. Pure Dart, so it runs under
  `dart test` without a `flutter_tester`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # `EnvironmentPath`, the directories a session row records.
  agent_cli:
    path: ../agent_cli
  # `Session` and `SessionStatus`, the record and the words it is kept at.
  karmashala_session:
    path: ../karmashala_session
  # The sessions domain's tables, which `store.dart` reads and writes.
  karmashala_store:
    path: ../karmashala_store
  # Verification runs, which the follow-up policy reads a verdict from.
  karmashala_verification:
    path: ../karmashala_verification

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
  sqlite3: any
