name: karmashala_devices
description: >-
  Drive an Android device or an iOS simulator from a desktop: adb and simctl,
  scrcpy's mirror and control socket, WebDriverAgent, the UI tree, files,
  logcat, wireless pairing and screen recording — and the pane that shows all
  of it, with the Riverpod graph under it. A Flutter package, so its suites
  run under `flutter test`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The runner every adb/simctl/scrcpy invocation goes through, plus
  # `EnvironmentPath` and `formatBytes`. One-way, and the only reason this
  # package can reach a WSL distribution at all (docs/PACKAGE_SPLIT.md §2).
  agent_cli:
    path: ../agent_cli
  flutter_riverpod: ^3.3.2
  # `Clock` behind this package's own clock port, and `AppLogger` — which
  # writes to the same root logger the app installs its handler on.
  karmashala_core:
    path: ../karmashala_core
  # The MP4 remuxer a screen recording is written through, and the reading of
  # what this host can encode with.
  karmashala_media:
    path: ../karmashala_media
  # Tokens, glyphs, the shared chrome the pane is drawn in, and the one
  # `PickerQuiet` the mirror registers with — see that package's picking.dart.
  karmashala_ui:
    path: ../karmashala_ui
  logging: ^1.3.0
  # The live picture the mirror is played into.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # The host's file clipboard, behind `HostClipboard`.
  pasteboard: ^0.5.0
  path: ^1.9.1
  riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.1
