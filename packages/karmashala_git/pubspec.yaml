name: karmashala_git
description: >-
  Reading and driving git: the porcelain and diff parsers, worktrees — their
  staged creation, setup plans and verdicts — the on-disk `.git` reader,
  repository discovery, review threads, GitHub's pull-request and
  branch-protection models, and the repository identities they hang off. Pure
  Dart, so it runs under `dart test` without a `flutter_tester`, and in the
  session host.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The runner a git command executes through and the environment types a path
  # is spelled in (`CommandRunner`, `EnvironmentPath`, `PathTranslator`), plus
  # `FileEditRecord`, the agent's record of a write that `file_edit_diff` draws.
  # One-way: agent_cli never imports this.
  agent_cli:
    path: ../agent_cli
  # `ListEquality` for `BranchProtection`'s required-checks list, which used
  # `listEquals` from `package:flutter/foundation.dart` in the app.
  collection: ^1.19.1
  # The hash a GitHub token is keyed by in a cache, so no map holds the token.
  crypto: ^3.0.0
  # The clock a worktree setup's verdict is stamped with.
  karmashala_core:
    path: ../karmashala_core
  # The `worktree_setup` tables `WorktreeSetupDao` reads and writes, so the
  # app and a session host that makes a worktree keep the same verdicts.
  karmashala_store:
    path: ../karmashala_store
  # `@immutable`, the other half of that same foundation import.
  meta: ^1.16.0
  # Joining and normalising the paths the `.git` readers walk.
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
