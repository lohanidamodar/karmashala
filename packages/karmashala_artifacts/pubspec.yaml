name: karmashala_artifacts
description: >-
  Artifacts an agent shows in its thread: the values, their wire shape, the
  tables and the library that snapshots each revision. No providers and no
  UI. Pure Dart, so the server keeps them for every client.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # EnvironmentPath: a source is a file on the session's own host.
  agent_cli:
    path: ../agent_cli
  # A revision's digest, so a rewrite with the same bytes is not a revision.
  crypto: ^3.0.6
  # A visual's spec, checked and read as every client reads it.
  karmashala_core:
    path: ../karmashala_core
  # The `session_artifacts` tables.
  karmashala_store:
    path: ../karmashala_store
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
