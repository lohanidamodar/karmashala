name: karmashala_device_pane
description: >-
  The device pane: a client's view of its own machine's Android devices and
  iOS simulators — the live mirror, a person's taps and keys, logcat,
  recordings, files, wireless pairing and slimming — and the Riverpod graph
  under it, over the pure `karmashala_devices`. A Flutter package, so its
  suites run under `flutter test`. Agents' device tools are the server's
  (slice 4a); this pane asks before a person acts on a device one holds.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The runner every adb/simctl/scrcpy invocation goes through, plus
  # `EnvironmentPath`.
  agent_cli:
    path: ../agent_cli
  flutter_riverpod: ^3.3.2
  # `Clock` and `AppLogger`.
  karmashala_core:
    path: ../karmashala_core
  # The drivers and the cores this pane draws — pure Dart, shared with the
  # server.
  karmashala_devices:
    path: ../karmashala_devices
  # What this host can encode a recording with.
  karmashala_media:
    path: ../karmashala_media
  # Tokens, glyphs, the shared chrome the pane is drawn in, and the one
  # `PickerQuiet` the mirror registers with — see that package's picking.dart.
  karmashala_ui:
    path: ../karmashala_ui
  logging: ^1.3.0
  # The live picture the mirror is played into.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # The host's file clipboard, behind `HostClipboard`.
  pasteboard: ^0.5.0
  path: ^1.9.1
  riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.1
