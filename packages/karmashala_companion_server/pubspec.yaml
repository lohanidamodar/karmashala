name: karmashala_companion_server
description: >-
  The desk end of a phone's link: the companion server (pairing, sealed
  channels, LAN and relay listeners, push fan-out), the codec for the calls the
  session host forwards to a connected app, and the answers the host gives from
  the store and its own screens while no app is connected. No providers and no
  UI. Pure Dart, so the session host runs it on a machine with no desktop.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The device key a runtime seals with.
  cryptography: ^2.9.0
  # The companion wire, the host session api and the transports.
  karmashala_remote:
    path: ../karmashala_remote
  # `Session` and `SessionStatus`, what the store answers a phone with.
  karmashala_session:
    path: ../karmashala_session
  # The `SessionDao` and the host id a session runs under.
  karmashala_session_engine:
    path: ../karmashala_session_engine
  # The notes and todos `notes.get` reads.
  karmashala_notes:
    path: ../karmashala_notes
  # The shared store: paired devices, metadata, and the tables above.
  karmashala_store:
    path: ../karmashala_store

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
