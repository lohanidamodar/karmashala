name: karmashala_snippets
description: >-
  Command snippets and saved terminal presets: the values, their JSON and the
  rules every copy follows (`karmashala_snippets.dart`), and the server's DAOs
  over their tables (`store.dart`). Pure Dart; a preset's shape travels as
  JSON, which the app reads as a `TerminalPreset`.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The `command_snippets` and `terminal_presets` tables (store.dart only).
  karmashala_store:
    path: ../karmashala_store

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
