name: karmashala_ssh
description: >-
  Reaching a machine over SSH: the connection and its pool, the host key
  policy, reading the private key a host names, the command runner and
  process handle, and browsing a remote directory. Not deploying the server
  (`karmashala_ssh_host`), the DAOs, the providers or any UI. Depends on
  nothing of the server's, so the server runs its own SSH work with it. Pure
  Dart, so it runs under `dart test` without a `flutter_tester` or a
  `sqlite3.dll`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # `CommandRunner`, `CommandRunnerFactory` and `ProcessHandle` — the SSH case
  # of the runner story whose local and WSL cases live there — plus
  # `ExecutionEnvironment`, `EnvironmentPath` and `PathTranslator`.
  agent_cli:
    path: ../agent_cli
  # `SshHost`, `KnownHostKey` and `SshConnectionState`, values the server's
  # data API carries too.
  karmashala_environments:
    path: ../karmashala_environments
  # The SSH client, its socket and channel types.
  dartssh2: ^4.1.0
  # Logging and `Clock`.
  karmashala_core:
    path: ../karmashala_core

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
