# Third-party vendored code (see VENDORED.md). It is not held to this project's
# flutter_lints profile; only our own edits to it have to be clean.
analyzer:
  errors:
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    unused_element: ignore
    unused_field: ignore
    unused_import: ignore
    dead_code: ignore
