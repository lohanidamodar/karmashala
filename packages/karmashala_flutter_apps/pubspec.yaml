name: karmashala_flutter_apps
description: >-
  Finding, running and driving a Flutter app from outside it: project and SDK
  discovery, the `--vmservice-out-file`, adb-logcat and mDNS routes to a VM
  service address, the Dart Tooling Daemon, and the VM service link itself —
  logs, errors, reload and the widget picker. Pure Dart, so it runs under
  `dart test` without a `flutter_tester` or a `sqlite3.dll`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The runner a scan or an SDK probe executes through, the environment kinds
  # and paths it is addressed in, and the `locateRequest` / version-parsing
  # shapes `FlutterSdkService` is modelled on. One-way: `agent_cli` never
  # imports this package (docs/PACKAGE_SPLIT.md §2).
  agent_cli:
    path: ../agent_cli
  # The VM service link logs through `package:logging` directly rather than
  # `karmashala_core`'s `AppLogger`, which wraps the same `Logger` — so the
  # app's root handler still receives every line and this package depends on
  # nothing local for it.
  logging: ^1.3.0
  path: ^1.9.1
  # The Dart VM service protocol: the link, the isolate, the service
  # extensions behind reload and the inspector.
  vm_service: ^15.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
