name: karmashala_core
description: >-
  Karmashala's Flutter-free core: logging and diagnostics, small utilities and
  filesystem path probing. Pure Dart, so it runs under `dart test` without a
  `flutter_tester` or `sqlite3.dll`. Frame and video encoding moved out to
  `karmashala_media`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  logging: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
