name: karmashala_core
description: >-
  Karmashala's Flutter-free core: logging and diagnostics, small utilities,
  filesystem path probing, and the media/frame-encoding layer. Pure Dart, so
  it runs under `dart test` without a `flutter_tester` or `sqlite3.dll`.
version: 0.1.0
publish_to: none

# The app's pub workspace resolves this member; there is no lock file of its
# own and no `pub get` to run inside it.
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # Frame encoding (animated GIF/PNG) for the terminal recorder.
  image: ^4.8.0
  # Media Foundation's C ABI, for the Windows H.264 writer.
  ffi: ^2.2.0
  logging: ^1.3.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
