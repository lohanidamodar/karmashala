name: chitragupta_mcp
description: >-
  Standalone MCP (Model Context Protocol) stdio bridge for the Chitragupta
  launcher agent. Forwards tool calls to the running app's control server. Kept
  as its own dependency-free package so it compiles to a small standalone exe
  (the main app package pulls in build-hook plugins that block `dart compile`).
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  chitragupta_local_ipc:
    path: ../packages/local_ipc
