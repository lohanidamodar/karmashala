name: karmashala_host
description: >-
  The Karmashala server: a standalone binary that owns every PTY, the store and
  the work on its machine, and outlives the clients that view them. The same
  bundle runs as the Karmashala host on an SSH box, which the server deploys,
  links to and relays (slice 5d).
publish_to: none

# The app's pub workspace resolves this member. It is built with `dart build
# cli`, not `dart compile exe`, which cannot reach a target with a build hook —
# and `sqlite3`, under `karmashala_store`, has one. The output is a bundle
# (`bin/karmashala_host` beside `lib/libsqlite3.so`), not a single file.
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  # Launch specs for the agents an automation starts, read in one file
  # (lib/src/automations/daemon_agents.dart) and never by agent id.
  agent_cli:
    path: ../packages/agent_cli
  # The browser the server drives over CDP (slice 3d): its service, the
  # `browser_*` tools and their consent. Pure Dart.
  karmashala_browser:
    path: ../packages/karmashala_browser
  # The scheduler, runner, settler and check runner the daemon hosts, and
  # the automation, resume and project-check tables. Pure Dart.
  karmashala_automations:
    path: ../packages/karmashala_automations
  # What the agent in each hosted session is doing, kept from the hooks this
  # host takes and the screens it holds, and the prompt answers typed into
  # them. Pure Dart; the app runs the same code only for its own panes.
  karmashala_agent_status:
    path: ../packages/karmashala_agent_status
  # Whose TUI a pane's screen shows (`TerminalGridStatusSource`), for
  # adopting a session a person started by hand where the shell said nothing.
  karmashala_agent_reporting:
    path: ../packages/karmashala_agent_reporting
  # The base checkpoint an automation run is undone to.
  karmashala_checkpoints:
    path: ../packages/karmashala_checkpoints
  # Fan-out comparisons: the server keeps their tables.
  karmashala_comparisons:
    path: ../packages/karmashala_comparisons
  karmashala_conversations:
    path: ../packages/karmashala_conversations
  karmashala_core:
    path: ../packages/karmashala_core
  karmashala_git:
    path: ../packages/karmashala_git
  # Every terminal's launch, built here on the server's own OS (slice 5a):
  # the profiles this machine offers, the argv and environment of a shell or
  # an agent, WSL through `wsl.exe` from a Windows server, shell integration.
  karmashala_launch:
    path: ../packages/karmashala_launch
  # The session row a daemon-started run writes, and how a session ended.
  karmashala_session:
    path: ../packages/karmashala_session
  # A check's verdict, recorded as Karmashala's own verification run.
  karmashala_verification:
    path: ../packages/karmashala_verification
  # Flutter runs, attached apps and project builds (slice 3d): the SDK, the
  # VM service and tooling-daemon links, project detection.
  karmashala_flutter_apps:
    path: ../packages/karmashala_flutter_apps
  # The sealed channel's key material. Already transitive through
  # `karmashala_remote`; declared because this package names the type.
  cryptography: ^2.9.0
  ffi: ^2.1.0
  # The app's schema, unchanged: the host owns sessions on a machine with no
  # GUI, so it carries the same ladder rather than a second one that could
  # drift. SQLite itself is bundled by the build hook, so the machine needs no
  # libsqlite3 of its own.
  # The companion's own frame protocol and the api that answers it. Pure Dart
  # and Flutter-free, which is what lets a host on a headless machine speak the
  # same wire the desktop does instead of inventing a second one.
  karmashala_remote:
    path: ../packages/karmashala_remote
  # The companion server itself — the same one the app runs where there is no
  # host — the forwarded-call codec, and the answers given from the store while
  # no app is connected. Pure Dart.
  karmashala_companion_server:
    path: ../packages/karmashala_companion_server
  # The data API's requests, answers and changes (protocol 11), which
  # `src/data/` answers from the store.
  karmashala_data_protocol:
    path: ../packages/karmashala_data_protocol
  # The app stores, read on request with the credentials this server holds:
  # the values and aggregator, and the two store clients. All pure Dart.
  store_console:
    path: ../packages/store_console
  store_console_apple:
    path: ../packages/store_console_apple
  store_console_play:
    path: ../packages/store_console_play
  # Environments, SSH hosts, trusted host keys, agent installations, saved
  # accounts and usage history: the rules `src/data/` applies and the tables
  # it writes.
  karmashala_environments:
    path: ../packages/karmashala_environments
  # `evidenceLine`: what a session blocked on a person is quoted as by
  # `session_wait` and `session_send`, the same line the app's inbox shows.
  karmashala_notifications:
    path: ../packages/karmashala_notifications
  # The notes and todos a phone's `notes.get` reads.
  karmashala_notes:
    path: ../packages/karmashala_notes
  # The workspace tables `src/data/` writes, and the rules it applies.
  karmashala_projects:
    path: ../packages/karmashala_projects
  # Where a unix socket can actually be bound. Pure `dart:io`, and the app uses
  # the same rule for the host's socket, so the two cannot disagree about it.
  karmashala_local_ipc:
    path: ../packages/local_ipc
  # The MCP wire and its HTTP binding: the daemon serves agents' tools with the
  # same code the app did, so the two cannot answer differently. Pure Dart.
  karmashala_mcp:
    path: ../packages/karmashala_mcp
  # `karmashala_host relay`: the same bundle a box already has can be the
  # relay for a desktop, so CI ships no second artifact. Pure Dart, no build
  # hook, and it imports nothing of ours — the dependency runs one way.
  karmashala_relay:
    path: ../relay
  # The relay's contract: the access-token rules `relay` and `server.json`
  # check, and the `/k/<token>` prefix a served relay URL carries.
  karmashala_relay_protocol:
    path: ../relay/protocol
  # The recorder that writes a hosted row's lifecycle status: the daemon is
  # its only caller, against the store the app passes with `--data-dir`.
  karmashala_session_engine:
    path: ../packages/karmashala_session_engine
  # Command snippets and saved presets: their DAOs, behind the data API.
  karmashala_snippets:
    path: ../packages/karmashala_snippets
  # SSH reached by the server itself (slice 3a): its pool over the saved
  # hosts and trusted keys, the key reader and the SSH command runner.
  karmashala_ssh:
    path: ../packages/karmashala_ssh
  # The host on an SSH box (slice 5d): the server deploys it there, keeps a
  # link to it and relays its sessions, sets up its relay and pairs phones.
  karmashala_ssh_host:
    path: ../packages/karmashala_ssh_host
  # The wire protocol, the host's paths and what reaching a host means,
  # shared with `karmashala_ssh_host` without a cycle (slice 5d).
  karmashala_host_protocol:
    path: ../packages/karmashala_host_protocol
  # A machine's files: this disk, WSL's share and SFTP, the save, the copy and
  # Quick Open's walk (slice 3c).
  # Android devices and iOS simulators on the server's machine (slice 4a):
  # adb and simctl, the fleet, the claims, the UI tree. Pure Dart.
  karmashala_devices:
    path: ../packages/karmashala_devices
  karmashala_files:
    path: ../packages/karmashala_files
  karmashala_store:
    path: ../packages/karmashala_store
  path: ^1.9.1
  # `SqliteException`: a refusal quotes its message, never the statement's
  # values (a saved account's credentials are one).
  sqlite3: ^3.3.3
  # `karmashala_host pair` draws the pairing QR in the terminal. Pure Dart,
  # BSD-3-Clause, and already the app's encoder (karmashala_ui's QrPainter).
  qr: ^4.0.0
  xterm2:
    git:
      url: https://github.com/lohanidamodar/xterm2.git
      ref: 0f8f42da5c32bd3c255e3aec367fffb65f26f7c6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # The in-process VM service the Flutter tests attach to.
  vm_service: ^15.2.0
