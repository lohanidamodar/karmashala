# The host package's own tags. Declaring one here is what stops `dart test`
# warning about it; it changes no default behaviour.
tags:
  # Cross-compiles the host for linux-x64 and runs it inside a real WSL
  # distribution. Excluded from the ordinary gate exactly as the app's
  # live-wsl tag is (CLAUDE.md §18) — the pty layer is FFI to a libc that
  # does not exist on the machine running the gate, so no stand-in can
  # answer for it. Run it deliberately:
  #   dart test --tags=live-wsl
  live-wsl:
  # Spawns real processes on this machine: a ConPTY with a real `cmd.exe`
  # behind it. Excluded from the ordinary gate for the same reason live-wsl
  # is — no stand-in can answer whether the FFI struct layouts are right, and
  # a failure here is as often the machine's as ours. Run it deliberately:
  #   dart test --tags=live
  live:
  # Starts a real ACP adapter (`npx -y @agentclientprotocol/...`) inside WSL
  # through the server's own runtime and spends model turns
  # (test/live/acp_live_test.dart). It skips itself unless KARMASHALA_LIVE_ACP=1
  # is set and WSL has npx, so the ordinary gate is unaffected. Run it
  # deliberately:
  #   dart test --tags=live-acp test/live/acp_live_test.dart
  live-acp:
