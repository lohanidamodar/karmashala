# The suite has hundreds of small files, so tester startup and compilation are
# the dominant cost. Eight workers cut the Windows gate from 6:19 to 3:55 while
# keeping the companion/network tests green. Twelve only saved another 42s and
# has less contention headroom, so keep the safer measured setting as the
# default for plain `flutter test` runs.
concurrency: 8

# Test tags. Declaring a tag here is what keeps `flutter test` from warning
# about it; it changes no default behaviour.
#
# Both tags below are excluded from the ordinary gate and run deliberately with
# `tool/live_tests.ps1` — see CLAUDE.md §18 for what a failure in each means.
tags:
  # Opt-in end-to-end tests that need a real SSH server (see
  # test/features/ssh/live_ssh_test.dart). They skip themselves when the
  # KARMASHALA_SSH_* environment variables are unset, so a normal run is
  # unaffected; `--exclude-tags live-ssh` drops them outright.
  live-ssh:

  # Opt-in end-to-end test of the WSL hook path (see
  # test/features/agents/live_wsl_hook_test.dart). It needs a real WSL
  # distribution with curl and a WSL virtual switch, and skips itself when it
  # finds none — so a normal run on a machine without WSL is unaffected.
  live-wsl:

  # A wall-clock measurement, not a behaviour: the shutdown envelope case in
  # test/core/lifecycle/app_lifecycle_test.dart. Every bound in `AppLifecycle`
  # is a real timeout, so a starved scheduler overshoots all of them at once
  # and the number becomes a reading of the machine's load rather than of this
  # app. It skips itself unless KARMASHALA_TIMING is set, exactly the way the
  # live tests above skip themselves without their prerequisites, so the
  # ordinary gate is unaffected whether or not it is excluded by name.
  live-timing:

  # A cost or soak measurement rather than a behaviour: seven suites that
  # spend ~100 s on ~40 tests (docs/PACKAGE_SPLIT.md §7). The full gate still
  # runs them; the per-package gate that the split introduces excludes them
  # with `--exclude-tags=live-ssh,live-wsl,cost`, so a change is measured by
  # its own tests and the soaks stay a pre-merge check.
  cost:
