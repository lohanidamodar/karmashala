# Test tags. Declaring a tag here is what keeps `flutter test` from warning
# about it; it changes no default behaviour.
#
# Both tags below are excluded from the ordinary gate and run deliberately with
# `tool/live_tests.ps1` — see CLAUDE.md §18 for what a failure in each means.
tags:
  # Opt-in end-to-end tests that need a real SSH server (see
  # test/features/ssh/live_ssh_test.dart). They skip themselves when the
  # KARMASHALA_SSH_* environment variables are unset, so a normal run is
  # unaffected; `--exclude-tags live-ssh` drops them outright.
  live-ssh:

  # Opt-in end-to-end test of the WSL hook path (see
  # test/features/agents/live_wsl_hook_test.dart). It needs a real WSL
  # distribution with curl and a WSL virtual switch, and skips itself when it
  # finds none — so a normal run on a machine without WSL is unaffected.
  live-wsl:
