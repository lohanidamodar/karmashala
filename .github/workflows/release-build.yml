name: Release

# Builds the release artifacts and attaches them to the release: the Windows
# installer and portable zip, the macOS DMG, the Linux tarball and AppImage,
# the Android APK, the server bundles for every platform with their install
# scripts, and the relay image on GHCR. Nothing is sent to Google Play.
#   - publishing a release uploads the artifacts to it,
#   - pushing a `v*` tag or dispatching with a version input creates the release.
on:
  # release: published only (not tag pushes) — creating a release shouldn't also
  # fire a second, duplicate run for its tag.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: write

# One release at a time per tag, never cancelled: a half-cancelled run would
# leave a release with only some of its files.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml, android-release.yml and the local Flutter.
  FLUTTER_VERSION: "3.47.5"

jobs:
  # Resolves the tag and whether to fill in release notes, so the build jobs
  # stay trigger-agnostic.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="$EVENT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build-windows:
    # The Linux hosts ship inside the installer, beside the app, where the
    # server looks for what it deploys to SSH boxes (host_bundles.dart).
    needs: [prepare, build-host-linux]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --dart-define=KARMASHALA_VERSION=${{ env.VERSION }} --dart-define=KARMASHALA_RELAY_URL=wss://kmrelay.popupbits.com
      # Mirrors tool/build_release.bat, the local recipe: keep the two in step.
      - name: Build and bundle the MCP bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The MCP bridge ships next to karmashala.exe, where the app looks for
          # it. Without it, agents get no Karmashala tools.
          flutter pub get --directory packages/mcp_bridge
          dart compile exe packages/mcp_bridge/bin/karmashala_mcp.dart -o app/build/windows/x64/runner/Release/karmashala_mcp.exe
      - name: Build and bundle the session host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # `dart build cli`, not `compile exe`: the host depends on sqlite3,
          # whose build hook `compile exe` refuses. The app looks for it at
          # host\bin\karmashala_host.exe beside karmashala.exe, and the bundle
          # keeps its SQLite at ..\lib, so it is copied whole.
          dart tool/sync_host_version.dart
          dart build cli -t server/bin/karmashala_host.dart -o build/host-windows
          Copy-Item -Recurse -Force build/host-windows/bundle app/build/windows/x64/runner/Release/host
      # The Linux hosts the `build-host-linux` job built, into the install
      # folder: without them the server answers `noBinary` to every SSH box.
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: app/build/windows/x64/runner/Release
      # Authenticode, only once a code-signing certificate is a secret
      # (docs/research/desktop-updates.md). Unsigned, SmartScreen warns on the
      # first run of each new download; signed, the warning fades as the
      # certificate earns reputation.
      - name: Load the code-signing certificate, when there is one
        id: authenticode
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            "::warning::No WINDOWS_SIGNING_PFX_BASE64 secret: the app and installer are unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:PFX_BASE64 -replace '\s', '')))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign the app's executables
        if: steps.authenticode.outputs.pfx != ''
        shell: pwsh
        env:
          PFX: ${{ steps.authenticode.outputs.pfx }}
          SIGNTOOL: ${{ steps.authenticode.outputs.signtool }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $files = Get-ChildItem app/build/windows/x64/runner/Release -Recurse -Include *.exe, *.dll |
            Where-Object { $_.Name -notmatch '^(msvcp|vcruntime|concrt)' }
          & $env:SIGNTOOL sign /f $env:PFX /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files.FullName
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "app\windows\installer\karmashala.iss"
      - name: Sign the installer
        if: steps.authenticode.outputs.pfx != ''
        shell: pwsh
        env:
          PFX: ${{ steps.authenticode.outputs.pfx }}
          SIGNTOOL: ${{ steps.authenticode.outputs.signtool }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:SIGNTOOL sign /f $env:PFX /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "app/windows/installer/output/Karmashala-Setup-$env:VERSION.exe"
          Remove-Item $env:PFX
      - name: Archive portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "build/artifacts/Karmashala-windows-portable.zip"
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app/windows/installer/output/Karmashala-Setup-${{ env.VERSION }}.exe
            build/artifacts/Karmashala-windows-portable.zip

  # The hosts deployed to other machines, built on the platform they run on.
  #
  # Not cross-compiled from Windows, measured 2026-09-15: `dart build cli
  # --target-os=linux` there bakes the bundled library's relative path with the
  # *building* machine's separator, so the binary hunts for
  # `..\lib\libsqlite3.so` and cannot open a store. `dart compile exe` is not an
  # option either — it refuses any target with a build hook, and sqlite3 has one.
  #
  # Each target ships as one tarball of its bundle, so the executable keeps the
  # SQLite it was built with beside it and the machine needs no libsqlite3.
  build-host-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build the session host bundles
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          dart tool/sync_host_version.dart
          for arch in x64 arm64; do
            dart build cli \
              -t server/bin/karmashala_host.dart \
              --target-os=linux --target-arch="$arch" \
              -o "build/host-linux-$arch"
            tar -czf "build/artifacts/karmashala_host-$VERSION-linux-$arch.tar.gz" \
              -C "build/host-linux-$arch/bundle" .
          done
      # For the desktop jobs that ship them (Windows, Linux).
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux
          path: build/artifacts/karmashala_host-*-linux-*.tar.gz
          if-no-files-found: error
      - name: Upload the host bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/karmashala_host-*-linux-*.tar.gz

  # The server on its own for macOS and Windows, for install.sh / install.ps1.
  # Each is built on the platform it runs on, like the Linux bundles above.
  build-host-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: macos, arch: arm64 }
          - { runner: macos-15-intel, platform: macos, arch: x64 }
          - { runner: windows-latest, platform: windows, arch: x64 }
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build the server bundle
        run: |
          dart tool/sync_host_version.dart
          dart build cli -t server/bin/karmashala_host.dart -o build/host
      - name: Package it (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          tar -czf "build/artifacts/karmashala_host-$VERSION-macos-${{ matrix.arch }}.tar.gz" -C build/host/bundle .
      - name: Package it (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/artifacts -Force | Out-Null
          Compress-Archive -Path build/host/bundle/* -DestinationPath "build/artifacts/karmashala_host-$env:VERSION-windows-x64.zip"
      - name: Upload it to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/karmashala_host-*

  # The installers, attached so .../releases/latest/download/install.sh always
  # names the newest server.
  attach-installers:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            server/deploy/install.sh
            server/deploy/install.ps1
            server/deploy/uninstall.sh

  # The relay as an image, for Docker and Fly.io: no Dart SDK needed to run one.
  relay-image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          file: relay/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/karmashala-relay:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/karmashala-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The Karmashala relay: a dumb pipe between a server and its clients

  # The macOS app, by the same recipe a local release uses (tool/build_release.sh):
  # the app, the MCP bridge and the session host inside the bundle, the host's
  # store and pty probes, an ad-hoc signature and a drag-to-install DMG.
  # Unnotarised: Gatekeeper asks on first open (right-click › Open).
  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      # Developer ID signing, only once its certificate is a secret
      # (docs/research/desktop-updates.md); without it the build stays ad-hoc
      # signed as before. A throwaway keychain, deleted with the runner.
      - name: Import the Developer ID certificate, when there is one
        id: devid
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::No MACOS_DEVELOPER_ID_P12_BASE64 secret: the app is ad-hoc signed and not notarised."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass=$(uuidgen)
          printf '%s' "$P12_BASE64" | tr -d '\r\n' | base64 -D > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "The certificate holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Build, bundle, sign and package
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.devid.outputs.identity }}
        run: tool/build_release.sh
      - name: Name the DMG for the release
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          dmg=$(ls app/build/macos/karmashala-*.dmg)
          cp "$dmg" "build/artifacts/Karmashala-macOS-$VERSION.dmg"
      # Notarised with the App Store Connect API key the iOS pipeline already
      # uses (docs/releases.md), so Gatekeeper opens the app without asking.
      - name: Sign, notarise and staple the DMG, when signed
        if: steps.devid.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.devid.outputs.identity }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -euo pipefail
          dmg="build/artifacts/Karmashala-macOS-$VERSION.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::warning::No App Store Connect key secrets: the DMG is signed but not notarised."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_CONTENT" | tr -d '\r\n' | base64 -D > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          rm -f "$key"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/Karmashala-macOS-${{ env.VERSION }}.dmg

  # The Android app as an APK on the release, for installing outside Play.
  # Signed with the upload key when the keystore secrets are set; without
  # them Gradle signs with the debug key, which installs but cannot update a
  # Play-installed copy. Nothing goes to Play here (android-release.yml).
  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Decode the upload keystore, when there is one
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is debug-signed."
            exit 0
          fi
          mkdir -p android/app/keystore
          KS="$PWD/android/app/keystore/upload-keystore.jks"
          # `tr -d '\r\n'` defends against CRLF / wrapped secrets.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KS"
          if [ "$(stat -c%s "$KS")" -lt 1000 ]; then
            echo "Decoded keystore is implausibly small — check ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            "$KS" > android/key.properties
      - name: Build the APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=KARMASHALA_VERSION=${{ env.VERSION }} --dart-define=KARMASHALA_RELAY_URL=wss://kmrelay.popupbits.com
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Karmashala-android-$VERSION.apk"
      - name: Upload the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/artifacts/Karmashala-android-${{ env.VERSION }}.apk

  build-linux:
    needs: [prepare, build-host-linux]
    # Pinned: ubuntu-latest became 26.04 on 2026-10-24, whose clang rejects
    # hotkey_manager_linux's plugin (-Werror,-Wsometimes-uninitialized). An
    # older base also keeps the bundle running on older distros.
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        # libkeybinder-3.0-dev is required by hotkey_manager's Linux plugin.
        # libx11-dev and libxi-dev are required by nativeapi, which tray_manager
        # has been built on since 0.6; libayatana-appindicator3-dev, which its
        # old Linux plugin needed, is no longer required by anything here.
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libsqlite3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev libmpv-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release --dart-define=KARMASHALA_VERSION=${{ needs.prepare.outputs.version }} --dart-define=KARMASHALA_RELAY_URL=wss://kmrelay.popupbits.com
      - name: Build and bundle the MCP bridge and session host
        run: |
          set -euo pipefail
          bundle=app/build/linux/x64/release/bundle
          flutter pub get --directory packages/mcp_bridge
          dart compile exe packages/mcp_bridge/bin/karmashala_mcp.dart -o "$bundle/karmashala_mcp"
          dart tool/sync_host_version.dart
          dart build cli -t server/bin/karmashala_host.dart -o build/host-linux-app
          cp -R build/host-linux-app/bundle "$bundle/host"
      # The deployable hosts beside the app, as the Windows installer has them.
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: app/build/linux/x64/release/bundle
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/Karmashala-linux.tar.gz -C app/build/linux/x64/release/bundle .
      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/Karmashala-linux.tar.gz
      # For the AppImage job, which packages this same bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/artifacts/Karmashala-linux.tar.gz
          if-no-files-found: error

  # The same Linux bundle as one AppImage file. Its own job, so a packaging
  # problem never holds up the tarball. linuxdeploy copies in the libraries
  # the app and its plugins link (mpv, libsecret, keybinder, appindicator,
  # notify); GTK, X11 and the graphics stack stay the host's, as AppImages
  # expect, because bundled copies break themes and drivers.
  build-linux-appimage:
    needs: [prepare, build-linux]
    # The same base as build-linux, which made the bundle it packages.
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # The runner has no FUSE; the tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux
      # What the bundle links, so linuxdeploy can find and copy it.
      - name: Install the libraries the app links
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libmpv2 libsecret-1-0 libkeybinder-3.0-0 libayatana-appindicator3-1 libnotify4 libsqlite3-0 imagemagick file
      - name: Package as an AppImage
        run: bash tool/package_appimage.sh build/linux/Karmashala-linux.tar.gz "$VERSION"
      # The .zsync is what AppImage managers read for a delta update; a run
      # whose tools wrote none still ships the AppImage.
      - name: Upload the AppImage to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            Karmashala-${{ env.VERSION }}-x86_64.AppImage
            Karmashala-${{ env.VERSION }}-x86_64.AppImage.zsync

  # SHA256SUMS.txt, once every file is on the release, for Scoop's autoupdate
  # and anyone verifying by hand (the desktop app reads GitHub's digests itself).
  # Built from the digests GitHub computed on upload, so nothing is downloaded
  # again. Runs even when a platform failed, so the rest still hear of the
  # release; it then warns which desktop file is missing.
  publish-checksums:
    needs:
      - prepare
      - build-windows
      - build-host-linux
      - build-host-desktop
      - attach-installers
      - build-macos
      - build-android
      - build-linux
      - build-linux-appimage
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          dart tool/release_sums.dart --release "$RUNNER_TEMP/release.json" --out build/sums
          cat build/sums/SHA256SUMS.txt
      - name: Upload it to the release
        run: gh release upload "$RELEASE_TAG" build/sums/SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-sums
          path: build/sums

  # The Homebrew tap and the Scoop bucket follow every release. Each is its own
  # repository, written with a token that can push to both; until that token
  # is a secret this job says so and does nothing. packaging/README.md lists
  # the repositories and the secret.
  bump-package-managers:
    needs: [prepare, publish-checksums]
    if: ${{ needs.publish-checksums.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TOKEN: ${{ secrets.PACKAGING_REPOS_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'lohanidamodar/homebrew-tap' }}
      BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'lohanidamodar/scoop-bucket' }}
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No PACKAGING_REPOS_TOKEN secret: the Homebrew tap and Scoop bucket were not bumped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: dart-lang/setup-dart@v1
        if: steps.token.outputs.present == 'true'
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: release-sums
          path: build/sums
      # A pre-release never reaches a package manager.
      - name: Commit the new version to the tap and the bucket
        if: steps.token.outputs.present == 'true' && !contains(needs.prepare.outputs.version, '-')
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump() {
            local repo=$1 only=$2 dir="$RUNNER_TEMP/$2"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${repo}.git" "$dir"
            dart tool/package_manifests.dart --version "$VERSION" \
              --sums build/sums/SHA256SUMS.txt --only "$only" --out "$RUNNER_TEMP/out-$only"
            cp -R "$RUNNER_TEMP/out-$only/$only/." "$dir/"
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then
              echo "$repo already has $VERSION."
              return
            fi
            git -C "$dir" commit -m "karmashala $VERSION"
            git -C "$dir" push origin HEAD
          }
          bump "$TAP_REPO" homebrew
          bump "$BUCKET_REPO" scoop

  # winget: a pull request to microsoft/winget-pkgs for each release, once the
  # first version is merged there by hand and WINGET_SUBMIT is set to true.
  # wingetcreate fetches the installer and hashes it itself.
  bump-winget:
    needs: [prepare, publish-checksums]
    if: ${{ needs.publish-checksums.result == 'success' && vars.WINGET_SUBMIT == 'true' && !contains(needs.prepare.outputs.version, '-') }}
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit the new version to winget-pkgs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINGET_TOKEN) { throw 'WINGET_SUBMIT is true but there is no WINGET_TOKEN secret.' }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/Karmashala-Setup-$env:VERSION.exe"
          .\wingetcreate.exe update PopupBits.Karmashala --version $env:VERSION --urls $url --submit --token $env:WINGET_TOKEN
