name: Release

# Builds the release artifacts and attaches them to the release: the Windows
# installer and portable zip, the macOS DMG, the Linux tarball and AppImage,
# the Android APK, the server bundles for every platform with their install
# scripts, and the relay image on GHCR. Nothing is sent to Google Play.
#   - publishing a release uploads the artifacts to it,
#   - pushing a `v*` tag or dispatching with a version input creates the release.
on:
  # release: published only (not tag pushes) — creating a release shouldn't also
  # fire a second, duplicate run for its tag.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: write

# One release at a time per tag, never cancelled: a half-cancelled run would
# leave a release with only some of its files.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml, android-release.yml and the local Flutter.
  FLUTTER_VERSION: "3.47.5"

jobs:
  # Resolves the tag and whether to fill in release notes, so the build jobs
  # stay trigger-agnostic.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="$EVENT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build-windows:
    # The Linux hosts ship inside the installer, beside the app, where the
    # server looks for what it deploys to SSH boxes (host_bundles.dart).
    needs: [prepare, build-host-linux]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --dart-define=KARMASHALA_VERSION=${{ env.VERSION }} --dart-define=KARMASHALA_RELAY_URL=wss://relay.popupbits.com
      # Mirrors tool/build_release.bat, the local recipe: keep the two in step.
      - name: Build and bundle the MCP bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The MCP bridge ships next to karmashala.exe, where the app looks for
          # it. Without it, agents get no Karmashala tools.
          flutter pub get --directory packages/mcp_bridge
          dart compile exe packages/mcp_bridge/bin/karmashala_mcp.dart -o app/build/windows/x64/runner/Release/karmashala_mcp.exe
      - name: Build and bundle the session host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # `dart build cli`, not `compile exe`: the host depends on sqlite3,
          # whose build hook `compile exe` refuses. The app looks for it at
          # host\bin\karmashala_host.exe beside karmashala.exe, and the bundle
          # keeps its SQLite at ..\lib, so it is copied whole.
          dart build cli -t server/bin/karmashala_host.dart -o build/host-windows
          Copy-Item -Recurse -Force build/host-windows/bundle app/build/windows/x64/runner/Release/host
      # The Linux hosts the `build-host-linux` job built, into the install
      # folder: without them the server answers `noBinary` to every SSH box.
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: app/build/windows/x64/runner/Release
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "app\windows\installer\karmashala.iss"
      - name: Archive portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "build/artifacts/Karmashala-windows-portable.zip"
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app/windows/installer/output/Karmashala-Setup-${{ env.VERSION }}.exe
            build/artifacts/Karmashala-windows-portable.zip

  # The hosts deployed to other machines, built on the platform they run on.
  #
  # Not cross-compiled from Windows, measured 2026-09-15: `dart build cli
  # --target-os=linux` there bakes the bundled library's relative path with the
  # *building* machine's separator, so the binary hunts for
  # `..\lib\libsqlite3.so` and cannot open a store. `dart compile exe` is not an
  # option either — it refuses any target with a build hook, and sqlite3 has one.
  #
  # Each target ships as one tarball of its bundle, so the executable keeps the
  # SQLite it was built with beside it and the machine needs no libsqlite3.
  build-host-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build the session host bundles
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          for arch in x64 arm64; do
            dart build cli \
              -t server/bin/karmashala_host.dart \
              --target-os=linux --target-arch="$arch" \
              -o "build/host-linux-$arch"
            tar -czf "build/artifacts/karmashala_host-$VERSION-linux-$arch.tar.gz" \
              -C "build/host-linux-$arch/bundle" .
          done
      # For the desktop jobs that ship them (Windows, Linux).
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux
          path: build/artifacts/karmashala_host-*-linux-*.tar.gz
          if-no-files-found: error
      - name: Upload the host bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/karmashala_host-*-linux-*.tar.gz

  # The server on its own for macOS and Windows, for install.sh / install.ps1.
  # Each is built on the platform it runs on, like the Linux bundles above.
  build-host-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: macos, arch: arm64 }
          - { runner: macos-15-intel, platform: macos, arch: x64 }
          - { runner: windows-latest, platform: windows, arch: x64 }
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build the server bundle
        run: dart build cli -t server/bin/karmashala_host.dart -o build/host
      - name: Package it (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          tar -czf "build/artifacts/karmashala_host-$VERSION-macos-${{ matrix.arch }}.tar.gz" -C build/host/bundle .
      - name: Package it (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/artifacts -Force | Out-Null
          Compress-Archive -Path build/host/bundle/* -DestinationPath "build/artifacts/karmashala_host-$env:VERSION-windows-x64.zip"
      - name: Upload it to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/karmashala_host-*

  # The installers, attached so .../releases/latest/download/install.sh always
  # names the newest server.
  attach-installers:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            server/deploy/install.sh
            server/deploy/install.ps1
            server/deploy/uninstall.sh

  # The relay as an image, for Docker and Fly.io: no Dart SDK needed to run one.
  relay-image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          file: relay/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/karmashala-relay:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/karmashala-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The Karmashala relay: a dumb pipe between a server and its clients

  # The macOS app, by the same recipe a local release uses (tool/build_release.sh):
  # the app, the MCP bridge and the session host inside the bundle, the host's
  # store and pty probes, an ad-hoc signature and a drag-to-install DMG.
  # Unnotarised: Gatekeeper asks on first open (right-click › Open).
  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build, bundle, sign and package
        run: tool/build_release.sh
      - name: Name the DMG for the release
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          dmg=$(ls app/build/macos/karmashala-*.dmg)
          cp "$dmg" "build/artifacts/Karmashala-macOS-$VERSION.dmg"
      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/Karmashala-macOS-${{ env.VERSION }}.dmg

  # The Android app as an APK on the release, for installing outside Play.
  # Signed with the upload key when the keystore secrets are set; without
  # them Gradle signs with the debug key, which installs but cannot update a
  # Play-installed copy. Nothing goes to Play here (android-release.yml).
  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Decode the upload keystore, when there is one
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is debug-signed."
            exit 0
          fi
          mkdir -p android/app/keystore
          KS="$PWD/android/app/keystore/upload-keystore.jks"
          # `tr -d '\r\n'` defends against CRLF / wrapped secrets.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KS"
          if [ "$(stat -c%s "$KS")" -lt 1000 ]; then
            echo "Decoded keystore is implausibly small — check ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            "$KS" > android/key.properties
      - name: Build the APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=KARMASHALA_VERSION=${{ env.VERSION }} --dart-define=KARMASHALA_RELAY_URL=wss://relay.popupbits.com
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/Karmashala-android-$VERSION.apk"
      - name: Upload the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: app/build/artifacts/Karmashala-android-${{ env.VERSION }}.apk

  build-linux:
    needs: [prepare, build-host-linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        # libkeybinder-3.0-dev is required by hotkey_manager's Linux plugin.
        # libx11-dev and libxi-dev are required by nativeapi, which tray_manager
        # has been built on since 0.6; libayatana-appindicator3-dev, which its
        # old Linux plugin needed, is no longer required by anything here.
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libsqlite3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev libmpv-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release --dart-define=KARMASHALA_VERSION=${{ needs.prepare.outputs.version }} --dart-define=KARMASHALA_RELAY_URL=wss://relay.popupbits.com
      - name: Build and bundle the MCP bridge and session host
        run: |
          set -euo pipefail
          bundle=app/build/linux/x64/release/bundle
          flutter pub get --directory packages/mcp_bridge
          dart compile exe packages/mcp_bridge/bin/karmashala_mcp.dart -o "$bundle/karmashala_mcp"
          dart build cli -t server/bin/karmashala_host.dart -o build/host-linux-app
          cp -R build/host-linux-app/bundle "$bundle/host"
      # The deployable hosts beside the app, as the Windows installer has them.
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: app/build/linux/x64/release/bundle
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/Karmashala-linux.tar.gz -C app/build/linux/x64/release/bundle .
      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/Karmashala-linux.tar.gz
      # For the AppImage job, which packages this same bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/artifacts/Karmashala-linux.tar.gz
          if-no-files-found: error

  # The same Linux bundle as one AppImage file. Its own job, so a packaging
  # problem never holds up the tarball. linuxdeploy copies in the libraries
  # the app and its plugins link (mpv, libsecret, keybinder, appindicator,
  # notify); GTK, X11 and the graphics stack stay the host's, as AppImages
  # expect, because bundled copies break themes and drivers.
  build-linux-appimage:
    needs: [prepare, build-linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # The runner has no FUSE; the tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux
      # What the bundle links, so linuxdeploy can find and copy it.
      - name: Install the libraries the app links
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libmpv2 libsecret-1-0 libkeybinder-3.0-0 libayatana-appindicator3-1 libnotify4 libsqlite3-0 imagemagick file
      - name: Package as an AppImage
        run: bash tool/package_appimage.sh build/linux/Karmashala-linux.tar.gz "$VERSION"
      - name: Upload the AppImage to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Karmashala-${{ env.VERSION }}-x86_64.AppImage
