name: Release

# Builds the desktop release artifacts (Windows installer + portable zip, macOS
# DMG, Linux tarball, Linux session hosts) and attaches them to the release.
#   - publishing a release uploads the artifacts to it,
#   - pushing a `v*` tag or dispatching with a version input creates the release.
on:
  # release: published only (not tag pushes) — creating a release shouldn't also
  # fire a second, duplicate run for its tag.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Resolves the tag and whether to fill in release notes, so the build jobs
  # stay trigger-agnostic.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "release" ]; then
            tag="$EVENT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build-windows:
    # The Linux hosts ship inside the installer, beside the app, where the
    # server looks for what it deploys to SSH boxes (host_bundles.dart).
    needs: [prepare, build-host-linux]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --dart-define=KARMASHALA_VERSION=${{ env.VERSION }} --dart-define=KARMASHALA_RELAY_URL=wss://relay.popupbits.com
      # Mirrors tool/build_release.bat, the local recipe: keep the two in step.
      - name: Build and bundle the MCP bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The MCP bridge ships next to karmashala.exe, where the app looks for
          # it. Without it, agents get no Karmashala tools.
          flutter pub get --directory packages/mcp_bridge
          dart compile exe packages/mcp_bridge/bin/karmashala_mcp.dart -o app/build/windows/x64/runner/Release/karmashala_mcp.exe
      - name: Build and bundle the session host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # `dart build cli`, not `compile exe`: the host depends on sqlite3,
          # whose build hook `compile exe` refuses. The app looks for it at
          # host\bin\karmashala_host.exe beside karmashala.exe, and the bundle
          # keeps its SQLite at ..\lib, so it is copied whole.
          dart build cli -t server/bin/karmashala_host.dart -o build/host-windows
          Copy-Item -Recurse -Force build/host-windows/bundle app/build/windows/x64/runner/Release/host
      # The Linux hosts the `build-host-linux` job built, into the install
      # folder: without them the server answers `noBinary` to every SSH box.
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: app/build/windows/x64/runner/Release
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "app\windows\installer\karmashala.iss"
      - name: Archive portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\artifacts -Force | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "build/artifacts/Karmashala-windows-portable.zip"
      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            app/windows/installer/output/Karmashala-Setup-${{ env.VERSION }}.exe
            build/artifacts/Karmashala-windows-portable.zip

  # The hosts deployed to other machines, built on the platform they run on.
  #
  # Not cross-compiled from Windows, measured 2026-09-15: `dart build cli
  # --target-os=linux` there bakes the bundled library's relative path with the
  # *building* machine's separator, so the binary hunts for
  # `..\lib\libsqlite3.so` and cannot open a store. `dart compile exe` is not an
  # option either — it refuses any target with a build hook, and sqlite3 has one.
  #
  # Each target ships as one tarball of its bundle, so the executable keeps the
  # SQLite it was built with beside it and the machine needs no libsqlite3.
  build-host-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build the session host bundles
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          for arch in x64 arm64; do
            dart build cli \
              -t server/bin/karmashala_host.dart \
              --target-os=linux --target-arch="$arch" \
              -o "build/host-linux-$arch"
            tar -czf "build/artifacts/karmashala_host-$VERSION-linux-$arch.tar.gz" \
              -C "build/host-linux-$arch/bundle" .
          done
      # For the desktop jobs that ship them (Windows, Linux).
      - uses: actions/upload-artifact@v4
        with:
          name: host-linux
          path: build/artifacts/karmashala_host-*-linux-*.tar.gz
          if-no-files-found: error
      - name: Upload the host bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/karmashala_host-*-linux-*.tar.gz

  # The macOS app, by the same recipe a local release uses (tool/build_release.sh):
  # the app, the MCP bridge and the session host inside the bundle, the host's
  # store and pty probes, an ad-hoc signature and a drag-to-install DMG.
  # Unnotarised: Gatekeeper asks on first open (right-click › Open).
  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build, bundle, sign and package
        run: tool/build_release.sh
      - name: Name the DMG for the release
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          dmg=$(ls app/build/macos/karmashala-*.dmg)
          cp "$dmg" "build/artifacts/Karmashala-macOS-$VERSION.dmg"
      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/Karmashala-macOS-${{ env.VERSION }}.dmg

  build-linux:
    needs: [prepare, build-host-linux]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        # libkeybinder-3.0-dev is required by hotkey_manager's Linux plugin.
        # libx11-dev and libxi-dev are required by nativeapi, which tray_manager
        # has been built on since 0.6; libayatana-appindicator3-dev, which its
        # old Linux plugin needed, is no longer required by anything here.
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libsqlite3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev libmpv-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs (zmodem, quiver, equatable, 2026-09-27).
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release --dart-define=KARMASHALA_VERSION=${{ needs.prepare.outputs.version }} --dart-define=KARMASHALA_RELAY_URL=wss://relay.popupbits.com
      - name: Build and bundle the MCP bridge and session host
        run: |
          set -euo pipefail
          bundle=app/build/linux/x64/release/bundle
          flutter pub get --directory packages/mcp_bridge
          dart compile exe packages/mcp_bridge/bin/karmashala_mcp.dart -o "$bundle/karmashala_mcp"
          dart build cli -t server/bin/karmashala_host.dart -o build/host-linux-app
          cp -R build/host-linux-app/bundle "$bundle/host"
      # The deployable hosts beside the app, as the Windows installer has them.
      - uses: actions/download-artifact@v4
        with:
          name: host-linux
          path: app/build/linux/x64/release/bundle
      - name: Archive Linux build
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/Karmashala-linux.tar.gz -C app/build/linux/x64/release/bundle .
      - name: Upload Linux artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/artifacts/Karmashala-linux.tar.gz
