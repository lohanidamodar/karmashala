name: CI

# Analyze everything on every pull request and push to main. A pull request
# tests only what its change can break (tool/ci_affected.dart); main tests
# everything. No secrets are read, so pull requests from forks run in full.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suites that exercise the hosted relay need one; a placeholder, never a
  # real relay.
  RELAY_DEFINE: --dart-define=KARMASHALA_RELAY_URL=wss://relay.example.com
  # Need a real WSL distribution, SSH server, device or agent, quiet timing, or
  # a machine nobody else is sharing.
  EXCLUDED_TAGS: live,live-ssh,live-wsl,live-android,live-timing,live-agent,cost,shared-runner

jobs:
  changes:
    name: What to test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.affected.outputs.app }}
      relay: ${{ steps.affected.outputs.relay }}
      member_shards: ${{ steps.affected.outputs.member_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE...HEAD" | dart tool/ci_affected.dart | tee -a "$GITHUB_OUTPUT"
          else
            dart tool/ci_affected.dart --all | tee -a "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The lock file as committed: a fresh resolution on a runner has dropped
      # packages the app needs.
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze app server packages

  relay-tests:
    name: Relay tests
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      # relay/ and its contract resolve on their own lock files.
      - name: Relay protocol
        working-directory: relay/protocol
        run: dart pub get && dart analyze && dart test
      - name: Relay
        working-directory: relay
        run: dart pub get && dart analyze && dart test

  # The app suite is split across runners: one 4-core runner is the bottleneck.
  app-tests:
    name: App tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: flutter test
        working-directory: app
        shell: pwsh
        run: |
          $index = ${{ matrix.shard }} - 1
          flutter test --exclude-tags=$env:EXCLUDED_TAGS $env:RELAY_DEFINE --total-shards=4 "--shard-index=$index"

  member-tests:
    name: Server and package tests
    needs: changes
    if: needs.changes.outputs.member_shards != '[]'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        members: ${{ fromJSON(needs.changes.outputs.member_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The git suites commit in scratch repositories; a runner has no identity.
      - run: git config --global user.name "Karmashala CI" && git config --global user.email ci@example.com
      - name: Each member's own suite
        shell: pwsh
        env:
          MEMBERS: ${{ matrix.members }}
        run: |
          $failed = @()
          foreach ($member in $env:MEMBERS -split ' ') {
            # A Flutter package needs flutter_tester; the rest run on plain Dart.
            $usesFlutter = Select-String -Path "$member/pubspec.yaml" -Pattern 'sdk: flutter' -Quiet
            Write-Host "::group::$member"
            Push-Location $member
            if ($usesFlutter) {
              flutter test --exclude-tags=$env:EXCLUDED_TAGS $env:RELAY_DEFINE
            } else {
              dart test --exclude-tags=$env:EXCLUDED_TAGS
            }
            if ($LASTEXITCODE -ne 0) { $failed += $member }
            Pop-Location
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failed: $($failed -join ', ')"
            exit 1
          }
