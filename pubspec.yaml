name: chitragupta
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.7
  flutter_pty: ^0.4.2
  flutter_riverpod: ^3.3.2
  highlight: ^0.7.0
  launch_at_startup: ^0.5.1
  logging: ^1.3.0
  pasteboard: ^0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  picons: ^3.0.1
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.6.0+eol
  tray_manager: ^0.5.3
  wakelock_plus: ^1.5.2
  window_manager: ^0.5.1
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation: `dart run flutter_launcher_icons` (regenerates the Windows
# .ico and other platform icons from assets/icon/app_icon.png).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
