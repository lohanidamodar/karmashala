name: karmashala_workspace
description: "The Karmashala repository's pub workspace: the app, the server and the shared packages. No code of its own."
publish_to: 'none'

environment:
  sdk: ^3.12.2

# Pub workspace. This root holds no code; every member declares `resolution:
# workspace` and shares this one resolution, lock file and `.dart_tool`, so a
# member's `dart test` needs no `pub get` of its own.
# Run `flutter pub get` here, at the root.
#
# `app` is the Flutter client and `server` the Karmashala server (package
# `karmashala_host`). The server joined on 2026-09-15, as `packages/host`: it
# carries the app's own store, and `karmashala_store` pulls in `sqlite3`, whose
# build hook `dart compile exe` refuses outright ("does not support build
# hooks") — so it is built with `dart build cli` and a standalone resolution
# would buy it nothing. Sharing this resolution is the point: one lock file is
# what stops the server's schema and the app's from drifting, the same reason
# they already share the wire protocol.
#
# Not every package in the tree is a member. `packages/mcp_bridge`, `relay`,
# `relay/protocol` and the plugin packages (`packages/flutter_pty`,
# `packages/launch_at_startup_fork`) stay out on purpose: each resolves on its
# own, and must not follow the app's resolution — `dart compile exe` cannot
# reach a target that pulls in the app's build-hook plugins, and relay's
# Dockerfile (fly.io, see relay/fly.toml) copies `relay/` alone, its
# `protocol/` with it, and runs `dart pub get` there, which a member cannot do
# ("found no workspace root including it"). Members depend on
# `relay/protocol` by path, like any path package. A member is marked by
# `resolution: workspace` in its own pubspec and by appearing below; nothing
# else is.
workspace:
  - app
  - server
  - packages/agent_cli
  - packages/karmashala_acp
  - packages/karmashala_agent_reporting
  - packages/karmashala_agent_status
  - packages/karmashala_artifacts
  - packages/karmashala_automations
  - packages/karmashala_browser
  - packages/karmashala_checkpoints
  - packages/karmashala_comparisons
  - packages/karmashala_conversations
  - packages/karmashala_companion_server
  - packages/karmashala_core
  - packages/karmashala_data_protocol
  - packages/karmashala_device_pane
  - packages/karmashala_devices
  - packages/karmashala_environments
  - packages/karmashala_files
  - packages/karmashala_flutter_apps
  - packages/karmashala_git
  - packages/karmashala_host_protocol
  - packages/karmashala_launch
  - packages/karmashala_mcp
  - packages/karmashala_media
  - packages/karmashala_notes
  - packages/karmashala_notifications
  - packages/karmashala_projects
  - packages/karmashala_remote
  - packages/karmashala_session
  - packages/karmashala_session_engine
  - packages/karmashala_snippets
  - packages/karmashala_ssh
  - packages/karmashala_ssh_host
  - packages/karmashala_store
  - packages/karmashala_terminal_core
