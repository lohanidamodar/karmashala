name: chitragupta
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  chitragupta_local_ipc:
    path: packages/local_ipc
  # End-to-end sealing for the mobile companion (XChaCha20-Poly1305, HKDF).
  cryptography: ^2.9.0
  dartssh2: ^3.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  # Companion mode only: attention notifications on the phone.
  flutter_local_notifications: ^19.0.0
  flutter_markdown_plus: ^1.0.7
  flutter_pty: ^0.4.2
  flutter_riverpod: ^3.3.2
  highlight: ^0.7.0
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  logging: ^1.3.0
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  # Companion mode only: the pairing screen's QR scanner.
  mobile_scanner: ^7.0.0
  media_kit_video: ^2.0.1
  pasteboard: ^0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  picons: ^3.0.1
  # Pure-Dart QR encoder for the remote-access pairing dialog.
  qr: ^4.0.0
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.6.0+eol
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  wakelock_plus: ^1.5.2
  # The relay client transport for the mobile companion.
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.1
  # Vendored fork — see packages/xterm/VENDORED.md.
  xterm:
    path: packages/xterm
  yaml: ^3.1.4

dev_dependencies:
  # The relay server, started in-process by the transport conformance tests.
  chitragupta_relay:
    path: packages/relay
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation: `dart run flutter_launcher_icons` (regenerates the Windows
# .ico and other platform icons from assets/icon/app_icon.png).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    # Same icon with a red badge, shown while sessions are waiting on the user.
    - assets/tray_icon_attention.ico
    # scrcpy-server (Apache-2.0) is deployed to the device to produce H.264 for
    # the device pane's live view. Its version must match kScrcpyVersion.
    - assets/scrcpy/
